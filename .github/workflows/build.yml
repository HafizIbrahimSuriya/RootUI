name: Build RootUI
# Runs when you push to main, or on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev zip
      - name: Build (zip with install.sh)
        run: sh ./BuildForLinux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RootUI-linux
          path: dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - name: Build exe (64-bit and 32-bit)
        shell: cmd
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          cargo build --release --target i686-pc-windows-msvc
          mkdir dist\windows-x64
          mkdir dist\windows-x86
          copy target\x86_64-pc-windows-msvc\release\rootui.exe dist\windows-x64\RootUI.exe
          copy target\i686-pc-windows-msvc\release\rootui.exe dist\windows-x86\RootUI.exe
          xcopy /e /i /y /q ui dist\windows-x64\ui
          xcopy /e /i /y /q ui dist\windows-x86\ui
      - name: Inno Setup installers
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\RootUI-x64.iss
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\RootUI-x86.iss
      - uses: actions/upload-artifact@v4
        with:
          name: RootUI-windows
          path: dist/installers/*.exe
