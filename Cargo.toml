[package]
name = "rootui"
version = "1.0.0"
edition = "2021"
description = "RootUI - a sci-fi terminal desktop, rebuilt in Rust (based on eDEX-UI)"
license = "GPL-3.0"

[features]
gui-subsystem = []   # kept for compatibility: release builds on Windows are always GUI (no console) now

[dependencies]
tao = "0.34"
wry = "0.53"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
sysinfo = "0.37"
dirs = "6"
rand = "0.9"
mime_guess = "2"
ureq = "2"
maxminddb = "0.26"
flate2 = "1"
tar = "0.4"
arboard = "3"
open = "5"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Power", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
